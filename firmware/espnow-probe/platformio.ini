[platformio]
default_envs = espnow-probe
build_dir = ../../.pio/espnow-probe

[env:espnow-probe]
build_src_filter = -<*> +<main.cpp>
platform = espressif32@6.6.0
platform_packages = platformio/framework-arduinoespressif32@3.20014.231204
board = az-delivery-devkit-v4
framework = arduino
board_build.partitions = ../led/partitions.csv
extra_scripts = pre:../nfc-probe/skip_arduino_start.py, pre:production_sources.py
lib_ldf_mode = off
build_flags = -std=gnu++11 -Wall -Wextra -I../../include -I../../lib/EspNowCommunicator
build_src_flags = -Werror
monitor_speed = 115200
upload_speed = 460800

[env:espnow-app-receiver]
extends = env:espnow-probe
build_src_filter = -<*> +<AppReceiver.cpp>
