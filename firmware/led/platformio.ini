; Standalone LED-only product. No external effect engine or application libraries.
[platformio]
default_envs = larp-led-product
build_dir = ../../.pio/led-product

[env:larp-led-product]
platform = espressif32@6.6.0
platform_packages = platformio/framework-arduinoespressif32@3.20014.231204
board = az-delivery-devkit-v4
framework = arduino
board_build.partitions = partitions.csv
build_flags =
    -std=gnu++11
    -DCORE_DEBUG_LEVEL=0
build_src_filter = +<*>
monitor_speed = 115200
upload_speed = 460800

; Explicit NFC/BLE test image. The default LED image does not start the reader.
[env:larp-nfc-test]
extends = env:larp-led-product
build_flags = ${env:larp-led-product.build_flags}
    -DLARP_NFC_TEST
    -I../nfc-probe/include

; Explicit BLE + ESP-NOW test; the default firmware does not start WiFi.
[env:larp-espnow-test]
extends = env:larp-led-product
build_flags = ${env:larp-led-product.build_flags}
    -DLARP_ESPNOW_TEST=1

; Historical hardware-test variant: column-LOW/high-Z, rows with pull-ups.
; Explicit B7-input opt-in reproduces the original wiring, NOT MCP23017 IO7
; datasheet compliance. Chip suitability and physical acceptance remain open.
; The default larp-led-product environment never initializes matrix pins.
[env:larp-matrix-test]
extends = env:larp-led-product
build_flags =
    ${env:larp-led-product.build_flags}
    -DLARP_MATRIX_TEST=1
    -DLARP_MATRIX_LEGACY_IO7_INPUT=1

; Isolated USB optical calibration. No BLE, provisioning, matrix, audio or NFC.
[env:larp-led-camera-lab]
extends = env:larp-led-product
build_flags = ${env:larp-led-product.build_flags}
    -DLARP_LED_CAMERA_LAB=1
build_src_filter = -<*> +<LedOutput.cpp> +<RmtLedBus.cpp> +<CameraLabMain.cpp> +<NearGlow.cpp> +<CameraLabController.cpp>

; Isolated LIVE laboratory plus the existing channel-1 ESP-NOW RSSI probe.
; No product BLE owner or automatic effect/RSSI mapping is included.
[env:larp-led-camera-rssi-lab]
extends = env:larp-led-camera-lab
build_flags = ${env:larp-led-camera-lab.build_flags}
    -DLARP_LED_CAMERA_RSSI_LAB=1
    -DLARP_ESPNOW_TEST=1
build_src_filter = ${env:larp-led-camera-lab.build_src_filter} +<CameraLabRssi.cpp> +<EspNowRadio.cpp>
