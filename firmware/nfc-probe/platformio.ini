[platformio]
default_envs = nfc-probe
build_dir = ../../.pio/nfc-probe

[env:nfc-probe]
extra_scripts = pre:skip_arduino_start.py
platform = espressif32@6.6.0
platform_packages = platformio/framework-arduinoespressif32@3.20014.231204
board = az-delivery-devkit-v4
framework = arduino
board_build.partitions = ../led/partitions.csv
build_flags = -std=gnu++11 -Wall -Wextra
monitor_speed = 115200
upload_speed = 460800
