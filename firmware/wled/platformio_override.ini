; Larp Escape WLED LED product, authenticated BLE as the only control ingress.
[env:larp-wled-ble]
extends = env:esp32dev
platform = espressif32@6.6.0
platform_packages = platformio/framework-arduinoespressif32@3.20014.231204
board = az-delivery-devkit-v4
board_build.partitions = larp_partitions.csv
build_src_filter = +<*> -<wled_main.cpp> -<wled_server.cpp>
custom_usermods = larp_ble
build_flags = ${common.build_flags}
  -DARDUINO_ARCH_ESP32 -DESP32 -DARDUINO_USB_CDC_ON_BOOT=0
  -D WLED_RELEASE_NAME=\"Larp_WLED_BLE\"
  -D WLED_DISABLE_OTA -D WLED_DISABLE_ALEXA -D WLED_DISABLE_HUESYNC
  -D WLED_DISABLE_INFRARED -D WLED_DISABLE_MQTT -D WLED_DISABLE_ESPNOW
  -D WLED_DISABLE_ADALIGHT -D WLED_DISABLE_2D
  -D WLED_DISABLE_PARTICLESYSTEM1D -D WLED_DISABLE_PARTICLESYSTEM2D
  -D WLED_DISABLE_PIXELFORGE -D WLED_DISABLE_IMPROV_WIFISCAN
  ; Keep LED RMT off the Bluetooth high-priority interrupt context.
  -D WLED_USE_SHARED_RMT
  -D CONFIG_ASYNC_TCP_USE_WDT=0
  -D LARP_WLED_BLE_PRODUCT=1
lib_deps =
  NeoPixelBus = git+https://github.com/Makuna/NeoPixelBus.git#1d7ff38f14d04a976f9c6e365c83a232bcba04fc
  ESPAsyncWebServerWLED = git+https://github.com/Aircoookie/ESPAsyncWebServer.git#fb607f9322798a25413e701e470542eca648de6e
  AsyncTCP = esp32async/AsyncTCP @ 3.4.7
lib_ignore = IRremoteESP8266, AsyncMqttClient, QuickESPNow, AnimatedGIF, GifDecoder, esp_dmx
extra_scripts =
  pre:pio-scripts/set_metadata.py
  post:pio-scripts/dynarray.py
  pre:pio-scripts/user_config_copy.py
  pre:pio-scripts/load_usermods.py
  pre:larp_verify_dependencies.py
  post:pio-scripts/validate_modules.py
upload_speed = 460800
