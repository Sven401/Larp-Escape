; Pure host contract; no product source, vendor PN532 API, or hardware.
[env:host-pn532-iso-dep-adapter]
platform = windows_x86@1.2.0
test_framework = unity
test_filter = test_pn532_iso_dep_adapter
build_src_filter = -<*>
build_flags = -std=gnu++11 -I include -Wall -Wextra -Wpedantic -Werror
lib_ldf_mode = off
lib_deps = throwtheswitch/Unity@2.6.1
