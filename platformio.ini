; PlatformIO Project Configuration File
;
; Target dependency versions are pinned to the Phase 0 baseline.
; Keep host regression tests separate from embedded target builds.

[env:az-delivery-devkit-v4]
extra_scripts = post:scripts/patch_pn532.py
platform = espressif32@6.6.0
board = az-delivery-devkit-v4
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++11 -I include
test_ignore = test_*
build_src_filter = +<*> -<RuntimeProbe/> -<ProfileTool/> -<ProfileRuntimeProbe/> -<GattsAbiProbe/>
lib_deps =
    adafruit/Adafruit PN532@1.3.4
    thomasfredericks/Bounce2@2.72.0
    plerup/EspSoftwareSerial@8.2.0
    adafruit/Adafruit MCP23017 Arduino Library@2.3.2
    fastled/FastLED@3.10.5
    powerbroker2/DFPlayerMini_Fast@1.2.4
    adafruit/Adafruit BusIO@1.17.4
    powerbroker2/FireTimer@1.0.5
    dok-net/ghostl@1.0.1

[env:host-regression]
platform = windows_x86@1.2.0
; Most legacy suites include their implementation directly; the package reader
; suite links this standalone source in both PlatformIO and CMake.
test_build_src = true
build_src_filter = -<*> +<GameConfiguration/CanonicalPackageJson.cpp>
    +<GameConfiguration/PackageDeclarations.cpp>
test_ignore =
    test_configured_control
    test_led_ble_wire
    test_mcp_adapter
    test_native_ble_source
    test_native_tls
lib_deps =
    throwtheswitch/Unity@2.6.1
test_framework = unity
lib_compat_mode = off
build_flags = -std=gnu++11 -I include -I test/test_regression/host_stubs
lib_ignore = Config, LedFx

[env:esp32-runtime-probe]
platform = espressif32@6.6.0
board = az-delivery-devkit-v4
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++11 -I include
build_src_filter = -<*> +<RuntimeProbe/> +<GameDomain/> +<Companion/>
test_ignore = test_*
lib_ignore = Config, LedFx, ArduinoClock, DFMinniHandler, EspNowCommunicator, EspNowRuntime, MCPHandler, MCPConfig, Keymatrixwrapper, NFCReader, SerialGameDiagnostics

; Hardware-free authoring/inspection tool; no Arduino or adapter-library scan.
[env:profile-tools]
platform = windows_x86@1.2.0
build_flags = -std=gnu++11 -I include -Wall -Wextra -Wpedantic -Werror
build_src_filter = -<*> +<ProfileTool/> +<GameConfiguration/> +<GameDomain/> +<GameExecution/> +<DeviceRuntime/> +<Companion/> +<CompanionIntegration/>
lib_ldf_mode = off
test_ignore = test_*

; Compile-only integration probe until an explicit device run is requested.
; Uses synthetic device owners; no GPIO, NFC, audio, LED or radio initialization.
[env:esp32-profile-runtime-probe]
platform = espressif32@6.6.0
board = az-delivery-devkit-v4
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++11 -I include -Wall -Wextra
build_src_flags = -Werror
build_src_filter = -<*> +<ProfileRuntimeProbe/> +<GameConfiguration/> +<GameDomain/> +<GameExecution/> +<DeviceRuntime/> +<Companion/> +<CompanionIntegration/>
lib_ignore = Config, LedFx, ArduinoClock, DFMinniHandler, EspNowCommunicator, EspNowRuntime, MCPHandler, MCPConfig, Keymatrixwrapper, NFCReader, SerialGameDiagnostics
test_ignore = test_*

; Vertical core/codec/actual adapter checks against deterministic copied RTOS ports.
[env:host-configured-control]
platform = windows_x86@1.2.0
test_framework = unity
test_filter = test_configured_control
test_build_src = true
build_src_filter = -<*> +<GameConfiguration/> +<GameDomain/> +<GameExecution/> +<DeviceRuntime/> +<Companion/> +<CompanionIntegration/>
build_flags = -std=gnu++11 -I include -I lib/FreeRtosGameControlChannel -I lib/FreeRtosCommandFrameQueue -I lib/FreeRtosProfileFrameQueue -I test/test_configured_control/host_stubs -Wall -Wextra -Wpedantic -Werror
lib_ldf_mode = off
lib_deps = throwtheswitch/Unity@2.6.1

; ABI-only synthetic raw GATTS write/queue probe. No BLE initialization or RF.
[env:esp32-gatts-abi-probe]
extra_scripts = pre:scripts/pin_gatt_source_sdk.py
platform = espressif32@6.6.0
board = az-delivery-devkit-v4
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++11 -I include -Wall -Wextra -Wl,--wrap=GATT_Register -Wl,--undefined=__wrap_GATT_Register -Wl,--wrap=SMP_Register -Wl,--undefined=__wrap_SMP_Register
build_src_flags = -Werror
build_src_filter = -<*> +<GattsAbiProbe/> +<Companion/> +<GameDomain/>
test_ignore = test_*
lib_ignore = Config, LedFx, ArduinoClock, DFMinniHandler, EspNowCommunicator, EspNowRuntime, MCPHandler, MCPConfig, Keymatrixwrapper, NFCReader, SerialGameDiagnostics

; Separate actual cryptography suite; verified official upstream sources only.
; LARP_PEER_MBEDTLS_DIR and LARP_PEER_MBEDTLS_ARCHIVE locate the audited source.
[env:host-peer-proof]
extends = env:host-configured-control
extra_scripts = pre:scripts/native_peer_mbedtls.py
build_flags = ${env:host-configured-control.build_flags} -DLARP_REAL_PEER_CRYPTO=1

; Actual pinned Adafruit/BusIO and legacy adapters over injected host Wire.
[env:host-mcp]
platform = windows_x86@1.2.0
test_framework = unity
test_filter = test_mcp_adapter
lib_compat_mode = off
lib_deps =
    adafruit/Adafruit MCP23017 Arduino Library@2.3.2
    adafruit/Adafruit BusIO@1.17.4
    throwtheswitch/Unity@2.6.1
build_flags = -std=gnu++11 -I include -I test/test_mcp_adapter/host_stubs -I test/test_game_application
lib_ignore = Config, LedFx
