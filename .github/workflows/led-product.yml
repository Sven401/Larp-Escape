name: LED product

on:
  push:
    paths: ['firmware/led/**', 'companion/android/**', 'docs/led/**', 'docs/audio/**', 'docs/matrix/**', 'docs/nfc/**', 'scripts/quality_evidence.py', 'test/test_led*/**', 'scripts/*led*', '.github/workflows/led-product.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  QUALITY_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  QUALITY_BASE_SHA: ${{ github.event.pull_request.base.sha }}

concurrency:
  group: led-product-${{ github.ref }}
  cancel-in-progress: true

jobs:
  camera-tools:
    name: Camera measurement tools (synthetic inputs)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-led-camera.txt
      - run: python -m unittest discover -s scripts/tests -p 'test_led_camera*.py'
      - run: python firmware/led/tests/run_camera_tests.py
      - name: Export all actual effect references
        run: |
          python scripts/led_camera_reference.py twinkle --output "$RUNNER_TEMP/twinkle.csv"
          python scripts/led_camera_reference.py burst --output "$RUNNER_TEMP/burst.csv"
          python scripts/led_camera_reference.py ripple --output "$RUNNER_TEMP/ripple.csv"

  protocol-output:
    name: LED protocol and output tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install native test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes g++ libssl-dev
      - name: Record common test sources
        run: python scripts/quality_evidence.py init
      - run: python scripts/quality_evidence.py run --name common-wire -- python test/test_led_ble_wire/run.py
      - run: python scripts/quality_evidence.py run --name led-wake-matrix -- python firmware/led/tests/run_output_tests.py
      - run: python scripts/quality_evidence.py run --name audio -- python firmware/led/tests/run_audio_tests.py
      - run: python scripts/quality_evidence.py run --name nfc -- python firmware/nfc-probe/tests/run_tests.py
      - name: Summarize common tests
        if: always()
        env:
          QUALITY_JOB_STATUS: ${{ job.status }}
        run: python scripts/quality_evidence.py finish
      - name: Preserve common test evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: common-wire-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/larp-quality-protocol-output/
          if-no-files-found: error

  firmware:
    name: LED ESP32 product build
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install platformio==6.2.0
      - name: Record common firmware sources
        run: python scripts/quality_evidence.py init
      - name: Build all separate product variants and record resources
        run: python scripts/quality_evidence.py run --name common-builds -- python -m platformio run -d firmware/led -e larp-led-product -e larp-nfc-test -e larp-matrix-test -j 2
      - name: Build isolated USB camera calibration firmware
        run: python -m platformio run -d firmware/led -e larp-led-camera-lab -j 2
      - name: Summarize common firmware checks
        if: always()
        env:
          QUALITY_JOB_STATUS: ${{ job.status }}
        run: python scripts/quality_evidence.py finish
      - name: Preserve common firmware evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: common-firmware-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/larp-quality-firmware/
          if-no-files-found: error

  android:
    name: Android tests, lint and builds
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install the requested Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" < /dev/null'
      - name: Test and build the real companion app
        working-directory: companion/android
        run: bash gradlew :core:protocol:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease --no-daemon
