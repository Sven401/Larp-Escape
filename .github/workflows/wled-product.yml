name: WLED product

on:
  push:
    paths: ['firmware/wled/**', 'companion/android/**', 'docs/led/**', 'test/test_wled*/**', 'scripts/*wled*', '.github/workflows/wled-product.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wled-product-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol-output:
    name: LED protocol and output tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install native test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes g++ libssl-dev
      - run: python test/test_wled_ble_wire/run.py
      - run: python firmware/wled/tests/run_output_tests.py
      - run: python firmware/wled/tests/test_prepare_wled.py

  firmware:
    name: WLED ESP32 product build
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install platformio==6.2.0
      - run: python scripts/prepare_wled.py
      - run: python -m platformio run -d .pio/wled-source-stable -e larp-wled-ble -j 2

  android:
    name: Android tests, lint and builds
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install the requested Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" < /dev/null'
      - name: Test and build the real companion app
        working-directory: companion/android
        run: bash gradlew :core:protocol:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease --no-daemon
