<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="930" viewBox="0 0 1200 930" role="img" aria-labelledby="title desc">
  <title id="title">Originalbox Lageplan mit Baugruppen und Messbereichen</title>
  <desc id="desc">Grobe, nicht maßstäbliche Skizze nach Fotos vom 10. Oktober 2026. Deckel oben, Bodenplatte unten. B1 links mit Audio und USB-C, B2 ESP32 mittig, B3 rechte Lochrasterplatine, B4 braune kleine Platine, B5 NFC im Deckel, B6 Kontaktmatrix im Deckel. MP-IDs markieren Suchbereiche, keine elektrisch bestätigten Pins.</desc>
  <defs>
    <style>
      .bg{fill:#fff}.outer{fill:#fafafa;stroke:#2e343b;stroke-width:3}.board{fill:#dcecdf;stroke:#287347;stroke-width:3}.brown{fill:#ead7b9;stroke:#946a33;stroke-width:3}.dark{fill:#333b42;stroke:#222;stroke-width:2}.nfc{fill:#f5d9db;stroke:#bd2d37;stroke-width:3}.term{fill:#2c9c58;stroke:#17633b;stroke-width:2}.wire{fill:none;stroke:#7c858e;stroke-width:4;stroke-dasharray:9 7}.grid{stroke:#b3a695;stroke-width:2}.t{font:24px Arial,sans-serif;fill:#1b2025}.small{font:19px Arial,sans-serif;fill:#343b43}.tiny{font:16px Arial,sans-serif;fill:#4b545d}.h{font:bold 31px Arial,sans-serif;fill:#14191e}.section{font:bold 25px Arial,sans-serif;fill:#14191e}.id{font:bold 23px Arial,sans-serif;fill:#111827}.mp circle{fill:#fff4c2;stroke:#6a5200;stroke-width:3}.mp text{font:bold 18px Arial,sans-serif;fill:#251e00;text-anchor:middle;dominant-baseline:middle}.lead{stroke:#5a4b18;stroke-width:3;fill:none}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="930"/>
  <text class="h" x="48" y="53">Originalbox – räumliche Suchskizze</text>
  <text class="small" x="48" y="85">Blick von vorn in die geöffnete Box · Deckel oben · Bodenplatte unten · nicht maßstäblich</text>

  <text class="section" x="48" y="135">Deckelinnenseite</text>
  <rect class="outer" x="45" y="150" width="1110" height="300" rx="8"/>
  <text class="id" x="69" y="189">B6  Kontaktmatrix</text>
  <text class="tiny" x="70" y="214">A–I und 1–9 sind vorhandene Ortsmarkierungen, keine bestätigten elektrischen Netze.</text>
  <rect x="85" y="230" width="660" height="177" fill="none" stroke="#8c8173" stroke-width="2"/>
