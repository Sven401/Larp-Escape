  <style>text{font-family:Arial,sans-serif;fill:#13303b} .board{fill:#d7efdc;stroke:#237349;stroke-width:5} .part{fill:#fff;stroke:#22535d;stroke-width:3} .head{fill:#e5edf4;stroke:#44637a;stroke-width:3} .note{font-size:20px} .title{font-size:30px;font-weight:bold} .label{font-size:23px;font-weight:bold}</style>
  <rect class="board" x="30" y="80" width="1140" height="600" rx="20"/>
