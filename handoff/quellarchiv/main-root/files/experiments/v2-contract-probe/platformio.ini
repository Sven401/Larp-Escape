[platformio]
src_dir = .
default_envs = host-contract

[env]
build_flags = -std=gnu++11 -Ifirmware/include -Iinclude -Ifirmware/lib/FreeRtosGameControlChannel -Ifirmware/lib/FreeRtosCommandFrameQueue
build_src_filter = +<firmware/src/> +<firmware/lib/FreeRtosGameControlChannel/*.cpp> +<firmware/lib/FreeRtosCommandFrameQueue/*.cpp>
lib_ldf_mode = off

[env:host-contract]
platform = windows_x86@1.2.0
build_flags = ${env.build_flags} -Ihost_stubs
build_src_filter = ${env.build_src_filter} +<host.cpp>

[env:esp32-contract]
platform = espressif32@6.6.0
board = az-delivery-devkit-v4
framework = arduino
monitor_speed = 115200
build_src_filter = ${env.build_src_filter} +<main.cpp>
lib_ldf_mode = chain
