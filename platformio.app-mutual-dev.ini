[platformio]
default_envs = host-app-mutual-dev

[env:host-app-mutual-dev]
platform = windows_x86@1.2.0
test_framework = unity
test_filter = test_app_mutual_dev_transcript
test_build_src = true
build_src_filter = -<*> +<CompanionIntegration/AppMutualDevTranscriptV1.cpp>
build_flags = -std=gnu++11 -I include -Wall -Wextra -Wpedantic -Werror
lib_ldf_mode = off
lib_deps = throwtheswitch/Unity@2.6.1
